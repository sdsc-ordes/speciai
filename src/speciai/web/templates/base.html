<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}speciai{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/js/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg
            class="brand-glyph"
            viewBox="0 0 24 24"
            fill="currentColor"
            role="img"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M11.4 3.6 C 10.6 2.6, 9.8 2, 8.8 1.7"
              fill="none"
              stroke="currentColor"
              stroke-width="0.7"
              stroke-linecap="round"
            />
            <path
              d="M12.6 3.6 C 13.4 2.6, 14.2 2, 15.2 1.7"
              fill="none"
              stroke="currentColor"
              stroke-width="0.7"
              stroke-linecap="round"
            />
            <circle cx="12" cy="4.8" r="1.5" />
            <ellipse cx="12" cy="8.8" rx="2" ry="2.5" />
            <rect x="11.6" y="10.8" width="0.8" height="1.8" />
            <path
              d="M12 12.3 C 13.9 13.2, 14.1 15.8, 12 21.5 C 9.9 15.8, 10.1 13.2, 12 12.3 Z"
            />
            <ellipse
              cx="8.4"
              cy="11.2"
              rx="4.4"
              ry="1.3"
              transform="rotate(-40 8.4 11.2)"
            />
            <ellipse
              cx="15.6"
              cy="11.2"
              rx="4.4"
              ry="1.3"
              transform="rotate(40 15.6 11.2)"
            />
          </svg>
        </span>
        <span class="brand-name">speciai</span>
        <span class="brand-sub"
          >{% block subtitle %}Specimen digitization{% endblock %}</span
        >
      </a>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
  </body>
</html>
