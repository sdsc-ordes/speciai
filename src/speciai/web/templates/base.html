<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}speciai{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <script src="/static/js/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg
            class="brand-glyph"
            viewBox="0 0 24 24"
            fill="currentColor"
            role="img"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M12 8 C 11 5, 9.6 4, 8 3.3"
              fill="none"
              stroke="currentColor"
              stroke-width="0.9"
              stroke-linecap="round"
            />
            <path
              d="M12 8 C 13 5, 14.4 4, 16 3.3"
              fill="none"
              stroke="currentColor"
              stroke-width="0.9"
              stroke-linecap="round"
            />
            <circle cx="8" cy="3.3" r="0.8" />
            <circle cx="16" cy="3.3" r="0.8" />
            <ellipse
              cx="8"
              cy="9.5"
              rx="5"
              ry="3.6"
              transform="rotate(-22 8 9.5)"
            />
            <ellipse
              cx="16"
              cy="9.5"
              rx="5"
              ry="3.6"
              transform="rotate(22 16 9.5)"
            />
            <ellipse
              cx="9"
              cy="15"
              rx="3.6"
              ry="2.9"
              transform="rotate(24 9 15)"
            />
            <ellipse
              cx="15"
              cy="15"
              rx="3.6"
              ry="2.9"
              transform="rotate(-24 15 15)"
            />
            <rect x="11.35" y="7.5" width="1.3" height="10.4" rx="0.65" />
          </svg>
        </span>
        <span class="brand-name">speciai</span>
        <span class="brand-sub"
          >{% block subtitle %}Specimen digitization{% endblock %}</span
        >
      </a>
    </header>
    <main class="container">{% block content %}{% endblock %}</main>
  </body>
</html>
