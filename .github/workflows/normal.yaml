name: normal
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - name: lint
        run: |
          nix develop --no-pure-eval --accept-flake-config "./tools/nix#ci" --command \
            just ci just lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - name: build
        run: |
          nix develop --no-pure-eval --accept-flake-config "./tools/nix#ci" --command \
          just ci just build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - name: test
        run: |
          nix develop --no-pure-eval --accept-flake-config "./tools/nix#ci" --command \
            just ci just test
